<!doctype html>
<!--
  Nova Systems business card — editable source.
  US standard 3.5in x 2in trim, 0.125in bleed (page = 3.75in x 2.25in), 0.125in safe margin inside trim.
  Render: node collateral/render.mjs  (review proof + print layout PDFs).
  Every value marked data-confirm is taken from the current website or the owner profile and must be
  confirmed by Isaac before printing (see PREPRINT_CHECKLIST.md).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nova Systems business card</title>
<style>
  :root { --black:#0A0A0A; --white:#FAFAFA; --gold:#C9A84C; --bleed:0.125in; }
  @page { size: 3.75in 2.25in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--black); font-family: "Helvetica Neue", Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .side { position: relative; width: 3.75in; height: 2.25in; background: var(--black); color: var(--white); overflow: hidden; page-break-after: always; }
  .safe { position: absolute; inset: calc(var(--bleed) + 0.125in); }

  /* Front: logo only */
  .front .safe { display: flex; align-items: center; justify-content: center; }
  .front img { mix-blend-mode: lighten; width: 1.25in; height: 1.25in; }

  /* Back: contact */
  .back .safe { display: flex; justify-content: space-between; }
  .back .who { display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-size: 12pt; font-weight: 700; letter-spacing: 0.02em; }
  .title { font-size: 7pt; color: var(--gold); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 3pt; }
  .rule { width: 0.4in; height: 1px; background: var(--gold); margin: 8pt 0; }
  .lines p { font-size: 7.5pt; line-height: 1.55; color: rgba(250,250,250,0.85); }
  .lines .co { font-size: 6.5pt; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 2pt; }
  .qr { width: 0.75in; height: 0.75in; align-self: flex-end; border: 1px dashed var(--gold); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 5pt; color: var(--gold); padding: 3pt; }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--bleed) + 0.04in); background: var(--gold); }

  /* Review mode: guides and confirm markers (never in the print layout) */
  .review .side::before { content: ""; position: absolute; inset: var(--bleed); outline: 0.5pt solid #e0447a; z-index: 5; }
  .review .side::after { content: ""; position: absolute; inset: calc(var(--bleed) + 0.125in); outline: 0.5pt dashed #3fa7ff; z-index: 5; }
  .review [data-confirm] { background: rgba(255,214,0,0.18); outline: 0.5pt dotted #ffd600; }
  .print .qr { border-style: solid; }
</style>
</head>
<body>
  <section class="side front">
    <div class="safe"><img src="../public/logo.png" alt="Nova Systems"></div>
  </section>

  <section class="side back">
    <div class="safe">
      <div class="who">
        <div>
          <p class="name" data-confirm="name as it should print">Isaac Nova</p>
          <p class="title" data-confirm="title">Chief Executive Officer</p>
          <div class="rule"></div>
        </div>
        <div class="lines">
          <p class="co">Nova Systems</p>
          <p data-confirm="phone (from website footer)">(203) 706-0504</p>
          <p data-confirm="email (from website footer)">hello@nova-systems.app</p>
          <p data-confirm="web address — site currently disabled">nova-systems.app</p>
          <p data-confirm="location (from website footer)">Waterbury, Connecticut</p>
        </div>
      </div>
      <div class="qr" data-confirm="QR destination">QR PLACEHOLDER<br>destination not confirmed</div>
    </div>
    <div class="stripe"></div>
  </section>
<script>
  document.body.classList.add(new URLSearchParams(location.search).get("mode") === "print" ? "print" : "review");
</script>
</body>
</html>
