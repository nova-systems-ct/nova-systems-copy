<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your jobs</title><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#090909;color:#f3f0e8;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:36px 18px 80px}h1{font:400 34px/1.1 Georgia,serif;margin:6px 0 4px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:#d5b96c;text-transform:uppercase;margin:0}
.job{border:1px solid #ffffff22;border-radius:12px;padding:18px;margin-top:16px;background:#ffffff05}.job h2{font-size:18px;margin:0 0 4px}.when{color:#d5b96c;font-weight:700;margin:0}
.job p{margin:8px 0}.muted{color:#aaa292;font-size:14px}a{color:#f3e3b0}.done{border-color:#4d7a4d}.badge{display:inline-block;font-size:12px;font-weight:800;border:1px solid #4d7a4d;color:#b6e3b6;border-radius:999px;padding:2px 10px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}textarea{width:100%;padding:12px;border-radius:7px;border:1px solid #ffffff33;background:#111;color:inherit;font:inherit;min-height:84px}
button{font:inherit;font-weight:800;font-size:15px;padding:13px 18px;border-radius:7px;border:0;background:#d6b96a;color:#111;cursor:pointer;margin-top:12px;width:100%}button.quiet{background:none;color:#aaa292;border:1px solid #ffffff22;font-weight:600}button:disabled{opacity:.55}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #d5b96c;outline-offset:2px}.error{color:#ff9d8a;font-weight:600}.note{font-size:14px;color:#aaa292}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.photo-btn{display:inline-block;border:1px solid currentColor;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}.photo-btn:focus-within{outline:3px solid #1f7fc4;outline-offset:2px}
</style><script type="module" src="/crew/crew.js?v=20261124a"></script></head>
<body><main><p class="eyebrow">Your jobs</p><h1 id="who">Hello</h1><p class="note">Jobs the business assigned to you. Press Done when a job is finished; the business is told at once.</p>
<p id="error" class="error" role="alert" hidden></p><section id="jobs" aria-live="polite"></section>
<button id="refresh" class="quiet" type="button">Refresh</button>
<noscript><p class="error">Turn on JavaScript to see your jobs.</p></noscript></main></body></html>
